<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#3fb950}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}
a.btn{display:inline-block;padding:.65rem 1.4rem;border-radius:8px;text-decoration:none;font-weight:600;background:var(--accent);color:#0d1117;margin-top:1rem}
